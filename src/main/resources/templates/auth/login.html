<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>社員管理システム | ログイン</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        /* =========================
           Main
           ========================= */

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            padding: 40px;
        }

        .login-title {
            margin: 0;
            color: #111827;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .login-description {
            margin: 10px 0 32px;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.7;
        }

        /* =========================
           Form
           ========================= */

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
        }

        .required {
            margin-left: 6px;
            color: #dc2626;
            font-size: 11px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            background-color: #ffffff;
            color: #111827;
            font-size: 14px;
            outline: none;
            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .form-input:hover {
            border-color: #9ca3af;
        }

        .form-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* =========================
           Login Button
           ========================= */

        .login-button {
            width: 100%;
            height: 46px;
            margin-top: 6px;
            border: none;
            border-radius: 5px;
            background-color: #1e3a5f;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition:
                background-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .login-button:hover {
            background-color: #17304f;
            box-shadow: 0 4px 10px rgba(30, 58, 95, 0.2);
        }

        .login-button:active {
            background-color: #132943;
        }

        /* =========================
           Error
           ========================= */

        .login-error {
            margin-bottom: 22px;
            padding: 11px 13px;
            border: 1px solid #fecaca;
            border-radius: 5px;
            background-color: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.5;
        }

        /* =========================
           Footer
           ========================= */

        .footer {
            padding: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 11px;
        }

        /* =========================
           Responsive
           ========================= */

        @media (max-width: 600px) {
            .header {
                height: 56px;
                padding: 0 20px;
            }

            .main {
                align-items: flex-start;
                padding: 32px 16px;
            }

            .login-card {
                padding: 30px 24px;
            }

            .login-title {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-logo">
            <div class="system-name">社員管理システム</div>
        </div>
    </header>

    <main class="main">

        <div class="login-container">

            <section class="login-card">

                <h1 class="login-title">ログイン</h1>

                <p class="login-description">
                    社員管理システムを利用するには、社員IDとパスワードを入力してください。
                </p>

                <form th:action="@{/login}" method="post">

                    <!-- Spring Security / Thymeleaf CSRF対策 -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- ログインエラー -->
                    <div class="login-error" th:if="${param.error}">
                        社員IDまたはパスワードが正しくありません。
                    </div>

                    <!-- ログアウト完了 -->
                    <div class="login-error" th:if="${param.logout}" style="color: #166534;
                            background-color: #f0fdf4;
                            border-color: #bbf7d0;">
                        ログアウトしました。
                    </div>

                    <!-- 社員ID -->
                    <div class="form-group">
                        <label class="form-label" for="employeeId">
                            社員ID
                            <span class="required">必須</span>
                        </label>

                        <input type="text" id="employeeId" name="username" class="form-input"
                            placeholder="社員IDを入力してください" autocomplete="username" required>
                    </div>

                    <!-- パスワード -->
                    <div class="form-group">
                        <label class="form-label" for="password">
                            パスワード
                            <span class="required">必須</span>
                        </label>

                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="パスワードを入力してください" autocomplete="current-password" required>
                    </div>

                    <!-- ログイン -->
                    <button type="submit" class="login-button">
                        ログイン
                    </button>

                </form>

            </section>

        </div>

    </main>

</body>

</html>
