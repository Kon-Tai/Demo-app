<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>社員管理システム | 部署管理</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        /* =========================
           Main
           ========================= */

        .main {
            min-height: 100vh;
            padding-top: 64px;
            transition: padding-left 0.2s ease;
        }

        body.menu-open .main {
            padding-left: 250px;
        }

        .content {
            padding: 40px;
        }

        /* =========================
           Page Header
           ========================= */

        .page-header {
            margin-bottom: 30px;
        }

        .page-title {
            margin: 0;

            color: #111827;

            font-size: 24px;
            font-weight: 700;
        }

        .page-description {
            margin: 8px 0 0;

            color: #6b7280;

            font-size: 13px;
        }

        /* =========================
           Toolbar
           ========================= */

        .toolbar {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 20px;
        }

        .search-form {
            display: flex;

            align-items: center;

            gap: 8px;
        }

        .search-input {
            width: 280px;

            height: 40px;

            padding: 0 14px;

            color: #374151;
            background-color: #ffffff;

            border: 1px solid #d1d5db;
            border-radius: 6px;

            font-size: 13px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search-input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .button {
            height: 40px;

            padding: 0 16px;

            border: none;
            border-radius: 6px;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search-button {
            color: #ffffff;
            background-color: #1e3a5f;
        }

        .search-button:hover {
            background-color: #162d4a;
        }

        .add-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 6px;

            color: #ffffff;
            background-color: #2563eb;

            text-decoration: none;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        /* =========================
           Department Card
           ========================= */

        .department-card {
            overflow: hidden;

            background-color: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 8px;

            box-shadow:
                0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .card-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 18px 20px;

            border-bottom: 1px solid #e5e7eb;
        }

        .card-title {
            margin: 0;

            color: #1f2937;

            font-size: 15px;
            font-weight: 600;
        }

        .department-count {
            color: #6b7280;

            font-size: 12px;
        }

        /* =========================
           Table
           ========================= */

        .table-wrapper {
            overflow-x: auto;
        }

        .department-table {
            width: 100%;

            border-collapse: collapse;

            font-size: 13px;
        }

        .department-table th {
            padding: 14px 20px;

            color: #6b7280;

            background-color: #f9fafb;

            border-bottom: 1px solid #e5e7eb;

            font-size: 12px;
            font-weight: 600;

            text-align: left;

            white-space: nowrap;
        }

        .department-table td {
            padding: 16px 20px;

            color: #374151;

            border-bottom: 1px solid #f1f5f9;

            vertical-align: middle;
        }

        .department-table tbody tr:last-child td {
            border-bottom: none;
        }

        .department-table tbody tr:hover {
            background-color: #f9fafb;
        }

        .department-id {
            width: 100px;

            color: #6b7280;
        }

        .department-name {
            color: #1f2937;

            font-weight: 600;
        }

        .employee-count {
            color: #6b7280;
        }

        .action-column {
            width: 180px;

            text-align: center !important;
        }

        .action-buttons {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;
        }

        .action-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            height: 32px;

            padding: 0 12px;

            border-radius: 5px;

            font-size: 12px;
            font-weight: 600;

            text-decoration: none;

            cursor: pointer;
        }

        .edit-button {
            color: #1d4ed8;

            background-color: #eff6ff;

            border: 1px solid #bfdbfe;
        }

        .edit-button:hover {
            background-color: #dbeafe;
        }

        .delete-button {
            color: #dc2626;

            background-color: #fef2f2;

            border: 1px solid #fecaca;
        }

        .delete-button:hover {
            background-color: #fee2e2;
        }

        /* =========================
           Empty
           ========================= */

        .empty-message {
            padding: 50px 20px;

            color: #9ca3af;

            font-size: 13px;

            text-align: center;
        }

        /* =========================
           Overlay
           ========================= */

        .sidebar-overlay {
            position: fixed;

            top: 64px;
            left: 0;

            z-index: 800;

            width: 100%;
            height: calc(100vh - 64px);

            background-color: rgba(15, 23, 42, 0.25);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }

        body.menu-open .sidebar-overlay {
            opacity: 1;
            visibility: visible;
        }

        /* =========================
           Responsive
           ========================= */

        @media (max-width: 700px) {

            .toolbar {
                align-items: stretch;

                flex-direction: column;
            }

            .search-form {
                width: 100%;
            }

            .search-input {
                flex: 1;

                width: auto;
            }

            .add-button {
                width: 100%;
            }

            .department-table th,
            .department-table td {
                padding: 12px 14px;
            }
        }

        @media (max-width: 600px) {

            .header {
                height: 56px;
                padding: 0 16px;
            }

            .system-name {
                font-size: 14px;
            }

            .user-info {
                display: none;
            }

            .sidebar {
                top: 56px;
                height: calc(100vh - 56px);
            }

            .sidebar-overlay {
                top: 56px;
                height: calc(100vh - 56px);
            }

            .main {
                padding-top: 56px;
            }

            body.menu-open .main {
                padding-left: 0;
            }

            .content {
                padding: 28px 16px;
            }

            .page-title {
                font-size: 22px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         Header
         ========================= -->

    <div th:replace="~{fragments/header :: header}"></div>


    <!-- =========================
         Sidebar
         ========================= -->

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>


    <!-- =========================
         Overlay
         ========================= -->

    <div class="sidebar-overlay" id="sidebarOverlay"></div>


    <!-- =========================
         Main
         ========================= -->

    <main class="main">

        <div class="content">

            <!-- =========================
                 Page Header
                 ========================= -->

            <section class="page-header">

                <h1 class="page-title">
                    部署管理
                </h1>

                <p class="page-description">
                    部署の登録・編集・削除を行います。
                </p>

            </section>


            <!-- =========================
                 Toolbar
                 ========================= -->

            <section class="toolbar">

                <form th:action="@{/departments}" method="get" class="search-form">

                    <input type="text" name="keyword" class="search-input" placeholder="部署名を検索" th:value="${keyword}">

                    <button type="submit" class="button search-button">

                        🔍
                        検索

                    </button>

                </form>


                <a th:href="@{/departments/new}" class="button add-button">

                    ＋
                    部署を追加

                </a>

            </section>


            <!-- =========================
                 Department List
                 ========================= -->

            <section class="department-card">

                <div class="card-header">

                    <h2 class="card-title">
                        部署一覧
                    </h2>

                    <span class="department-count">

                        全
                        <span th:text="${departments != null ? #lists.size(departments) : 0}">
                            0
                        </span>
                        件

                    </span>

                </div>


                <div class="table-wrapper">

                    <table class="department-table">

                        <thead>

                            <tr>

                                <th class="department-id">
                                    ID
                                </th>

                                <th>
                                    部署名
                                </th>

                                <th>
                                    部署コード
                                </th>

                                <th>
                                    所属社員数
                                </th>

                                <th class="action-column">
                                    操作
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            <tr th:each="department : ${departments}">

                                <td class="department-id" th:text="${department.id}">
                                    1
                                </td>

                                <td class="department-name" th:text="${department.name}">
                                    総務部
                                </td>

                                <td th:text="${department.code}">
                                    SOUMU
                                </td>
                                <td class="employee-count">

                                    <span th:text="${#lists.size(department.employees)}">
                                        0
                                    </span>
                                    人

                                </td>

                                <td class="action-column">

                                    <div class="action-buttons">

                                        <a th:href="@{/departments/{id}/edit(id=${department.id})}"
                                            class="action-button edit-button">

                                            編集

                                        </a>


                                        <form th:action="@{/departments/{id}/delete(id=${department.id})}" method="post"
                                            onsubmit="return confirm('この部署を削除しますか？');">

                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}">

                                            <button type="submit" class="action-button delete-button">

                                                削除

                                            </button>

                                        </form>

                                    </div>

                                </td>

                            </tr>


                            <!-- =========================
                                 Empty
                                 ========================= -->

                            <tr th:if="${departments == null || #lists.isEmpty(departments)}">

                                <td colspan="5" class="empty-message">

                                    登録されている部署はありません。

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>


    <script th:src="@{/js/common.js}">
    </script>

</body>

</html>
