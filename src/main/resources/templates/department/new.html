<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社員管理システム | 部署追加</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        /* =========================
       Page Header
       ========================= */

        .page-header {
            margin-bottom: 30px;
        }

        .page-title {
            margin: 0;

            color: #111827;

            font-size: 24px;
            font-weight: 700;
        }

        .page-description {
            margin: 8px 0 0;

            color: #6b7280;

            font-size: 13px;
        }

        /* =========================
       Form Card
       ========================= */
        @media (max-width: 600px) {

            .content {
                padding: 28px 16px;
            }

            .form-card {
                width: 100%;
            }
        }

        .form-card {
            width: 100%;
            max-width: 720px;
            box-sizing: border-box;

            margin: 0 auto;

            background-color: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 8px;

            box-shadow:
                0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .card-header {
            padding: 18px 20px;

            border-bottom: 1px solid #e5e7eb;
        }

        .card-title {
            margin: 0;

            color: #1f2937;

            font-size: 15px;
            font-weight: 600;
        }

        .form-body {
            padding: 28px 24px;
        }

        /* =========================
       Message
       ========================= */

        .message {
            margin-bottom: 20px;
            padding: 12px 14px;

            border-radius: 6px;

            font-size: 13px;
        }

        .error-message {
            color: #b91c1c;

            background-color: #fef2f2;

            border: 1px solid #fecaca;
        }

        /* =========================
       Form
       ========================= */

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-size: 13px;
            font-weight: 600;
        }

        .required {
            display: inline-block;

            margin-left: 6px;
            padding: 2px 6px;

            color: #dc2626;
            background-color: #fef2f2;

            border-radius: 4px;

            font-size: 11px;
            font-weight: 600;
        }

        .form-input {
            box-sizing: border-box;

            width: 100%;
            height: 42px;

            padding: 0 12px;

            color: #374151;
            background-color: #ffffff;

            border: 1px solid #d1d5db;
            border-radius: 6px;

            font-size: 13px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .form-help {
            margin: 7px 0 0;

            color: #9ca3af;

            font-size: 12px;
            line-height: 1.5;
        }

        /* =========================
       Form Actions
       ========================= */

        .form-actions {
            display: flex;

            align-items: center;
            justify-content: flex-end;

            gap: 10px;

            margin-top: 30px;
            padding-top: 20px;

            border-top: 1px solid #e5e7eb;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            height: 40px;

            padding: 0 18px;

            border-radius: 6px;

            font-size: 13px;
            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }

        .cancel-button {
            color: #374151;
            background-color: #ffffff;

            border: 1px solid #d1d5db;
        }

        .cancel-button:hover {
            background-color: #f9fafb;
        }

        .submit-button {
            color: #ffffff;
            background-color: #2563eb;

            border: 1px solid #2563eb;
        }

        .submit-button:hover {
            background-color: #1d4ed8;

            border-color: #1d4ed8;
        }

        /* =========================
       Overlay
       ========================= */

        .sidebar-overlay {
            position: fixed;

            top: 64px;
            left: 0;

            z-index: 800;

            width: 100%;
            height: calc(100vh - 64px);

            background-color: rgba(15, 23, 42, 0.25);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }

        body.menu-open .sidebar-overlay {
            opacity: 1;
            visibility: visible;
        }

        /* =========================
       Responsive
       ========================= */

        @media (max-width: 700px) {

            body.menu-open .main {
                padding-left: 0;
            }

            .content {
                padding: 28px 16px;
            }

            .form-card {
                max-width: none;
            }

            .form-body {
                padding: 24px 18px;
            }

            .form-actions {
                flex-direction: column-reverse;

                align-items: stretch;
            }

            .button {
                width: 100%;
            }
        }

        @media (max-width: 600px) {

            .header {
                height: 56px;
                padding: 0 16px;
            }

            .system-name {
                font-size: 14px;
            }

            .user-info {
                display: none;
            }

            .sidebar {
                top: 56px;
                height: calc(100vh - 56px);
            }

            .sidebar-overlay {
                top: 56px;
                height: calc(100vh - 56px);
            }

            .main {
                padding-top: 56px;
            }

            .page-title {
                font-size: 22px;
            }
        }
    </style>

</head>

<body>


    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>


    <main class="main">

        <div class="content">

            <!-- =========================
             Page Header
             ========================= -->

            <section class="page-header">

                <h1 class="page-title">
                    部署追加
                </h1>

                <p class="page-description">
                    新しい部署を登録します。
                </p>

            </section>


            <!-- =========================
             Form Card
             ========================= -->

            <section class="form-card">

                <div class="card-header">

                    <h2 class="card-title">
                        部署情報
                    </h2>

                </div>


                <div class="form-body">

                    <!-- エラーメッセージ -->

                    <div th:if="${errorMessage}" class="message error-message" th:text="${errorMessage}">
                        エラーメッセージ
                    </div>


                    <!-- 登録フォーム -->

                    <form th:action="@{/departments}" method="post">

                        <!-- CSRF -->

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">


                        <!-- 部署名 -->

                        <div class="form-group">

                            <label for="name" class="form-label">

                                部署名

                                <span class="required">
                                    必須
                                </span>

                            </label>

                            <input type="text" id="name" name="name" class="form-input" placeholder="例：総務部"
                                maxlength="100" required>

                            <p class="form-help">
                                部署の正式名称を入力してください。
                            </p>

                        </div>


                        <!-- 部署コード -->

                        <div class="form-group">

                            <label for="code" class="form-label">

                                部署コード

                            </label>

                            <input type="text" id="code" name="code" class="form-input" placeholder="例：SOUMU"
                                maxlength="50">

                            <p class="form-help">
                                部署を識別するためのコードです。入力は任意です。
                            </p>

                        </div>


                        <!-- Buttons -->

                        <div class="form-actions">

                            <a th:href="@{/departments}" class="button cancel-button">

                                キャンセル

                            </a>


                            <button type="submit" class="button submit-button">

                                登録する

                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </div>

    </main>


    <script th:src="@{/js/common.js}">
    </script>

</body>

</html>
