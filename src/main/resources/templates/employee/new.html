<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>社員新規登録 | 社員管理システム</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        /* =========================
           Breadcrumb
           ========================= */

        .breadcrumb {
            margin-bottom: 10px;

            color: #6b7280;

            font-size: 12px;
        }

        .breadcrumb a {
            color: #2563eb;

            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* =========================
           Page title
           ========================= */

        .page-title {
            margin: 0 0 28px;

            color: #111827;

            font-size: 24px;
            font-weight: 700;
        }

        /* =========================
           Card
           ========================= */

        .register-card {
            background-color: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 8px;

            box-shadow:
                0 4px 12px rgba(15, 23, 42, 0.04);

            overflow: hidden;
        }

        .card-header {
            padding: 22px 28px;

            border-bottom: 1px solid #e5e7eb;

            background-color: #fafbfc;
        }

        .card-title {
            margin: 0;

            color: #111827;

            font-size: 16px;
            font-weight: 700;
        }

        .card-description {
            margin: 6px 0 0;

            color: #6b7280;

            font-size: 12px;
        }

        /* =========================
           Form
           ========================= */

        .form {
            padding: 30px 28px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-size: 13px;
            font-weight: 600;
        }

        .required {
            margin-left: 6px;

            color: #dc2626;

            font-size: 11px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            height: 44px;

            padding: 0 13px;

            border: 1px solid #d1d5db;
            border-radius: 5px;

            background-color: #ffffff;

            color: #111827;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .form-input:hover {
            border-color: #9ca3af;
        }

        .form-input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-help {
            margin-top: 6px;

            color: #9ca3af;

            font-size: 11px;
        }

        /* =========================
           Buttons
           ========================= */

        .actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            padding-top: 8px;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 120px;
            height: 42px;

            padding: 0 18px;

            border-radius: 5px;

            font-size: 13px;
            font-weight: 600;

            text-decoration: none;

            cursor: pointer;
        }

        .button-secondary {
            border: 1px solid #d1d5db;

            background-color: #ffffff;

            color: #374151;
        }

        .button-secondary:hover {
            background-color: #f9fafb;
        }

        .button-primary {
            border: 1px solid #1e3a5f;

            background-color: #1e3a5f;

            color: #ffffff;
        }

        .button-primary:hover {
            background-color: #17304f;
        }

        /* =========================
           Responsive
           ========================= */

        @media (max-width: 600px) {

            .header {
                padding: 0 16px;
            }

            .header-user {
                display: none;
            }

            .main {
                padding: 28px 16px;
            }

            .page-title {
                font-size: 21px;
            }

            .form {
                padding: 24px 20px;
            }

            .actions {
                flex-direction: column-reverse;
            }

            .button {
                width: 100%;
            }
        }
    </style>

</head>


<body>

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main">

        <!-- パンくず -->

        <div class="breadcrumb">

            <a th:href="@{/}">
                ホーム
            </a>

            <span> / </span>

            <a th:href="@{/employees}">
                社員一覧
            </a>

            <span> / 社員新規登録</span>

        </div>


        <h1 class="page-title">
            社員新規登録
        </h1>


        <section class="register-card">

            <div class="card-header">

                <h2 class="card-title">
                    社員情報を入力
                </h2>

                <p class="card-description">
                    新しく登録する社員の情報を入力してください。
                </p>

            </div>


            <!-- 登録フォーム -->

            <form class="form" th:action="@{/employees}" method="post">

                <!-- Spring Security CSRF -->

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">


                <!-- 社員ID -->
                <div class="form-group">

                    <label class="form-label">
                        社員ID
                    </label>

                    <div class="form-input" style="display:flex; align-items:center; background-color:#f9fafb;">
                        <span th:text="${nextEmployeeId}">
                            EMP0001
                        </span>
                    </div>

                    <div class="form-help">
                        社員IDはシステム設定に登録された接頭辞を使用して自動生成されます。
                    </div>

                </div>

                <!-- 氏名 -->

                <div class="form-group">

                    <label class="form-label" for="name">

                        氏名

                        <span class="required">
                            必須
                        </span>

                    </label>

                    <input type="text" id="name" name="name" class="form-input" placeholder="例：山田 太郎" required>

                </div>


                <!-- 部署 -->

                <div class="form-group">

                    <label for="departmentId">
                        部署
                    </label>

                    <select id="departmentId" name="departmentId">

                        <option value="">
                            部署を選択してください
                        </option>

                        <option th:each="department : ${departments}" th:value="${department.id}"
                            th:text="${department.name}">
                            総務部
                        </option>

                    </select>

                </div>



                <!-- 役職 -->

                <div class="form-group">

                    <label class="form-label" for="position">

                        役職

                    </label>

                    <input type="text" id="position" name="position" class="form-input" placeholder="例：一般社員">

                </div>


                <!-- メールアドレス -->

                <div class="form-group">

                    <label class="form-label" for="email">

                        メールアドレス

                    </label>

                    <input type="email" id="email" name="email" class="form-input" placeholder="example@example.com">

                </div>


                <!-- ボタン -->

                <div class="actions">

                    <a th:href="@{/employees}" class="button button-secondary">

                        キャンセル

                    </a>


                    <button type="submit" class="button button-primary">

                        登録する

                    </button>

                </div>

            </form>

        </section>

    </main>

    <script th:src="@{/js/common.js}">
    </script>

</body>

</html>
