<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<aside th:fragment="sidebar" class="sidebar">

    <div class="menu-title">
        MENU
    </div>

    <nav>

        <ul class="menu-list">

            <li class="menu-item">

                <a th:href="@{/}" class="menu-link" th:classappend="${currentPage == 'home'} ? ' active'">

                    <span class="menu-icon">
                        🏠
                    </span>

                    <span>
                        ホーム
                    </span>

                </a>

            </li>

            <li class="menu-item">

                <a th:href="@{/employees}" class="menu-link" th:classappend="${currentPage == 'employees'} ? ' active'">

                    <span class="menu-icon">
                        👥
                    </span>

                    <span>
                        社員一覧
                    </span>

                </a>

            </li>

            <li class="menu-item">

                <a th:href="@{/departments}" class="menu-link"
                    th:classappend="${currentPage == 'departments'} ? ' active'">

                    <span class="menu-icon">
                        🏢
                    </span>

                    <span>
                        部署管理
                    </span>

                </a>

            </li>

            <li class="menu-item">

                <a th:href="@{/settings}" class="menu-link" th:classappend="${currentPage == 'settings'} ? ' active'">

                    <span class="menu-icon">
                        ⚙
                    </span>

                    <span>
                        システム設定
                    </span>

                </a>

            </li>

        </ul>

    </nav>

    <div class="sidebar-bottom">

        <form th:action="@{/logout}" method="post">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button type="submit" class="logout-button">

                <span class="menu-icon">
                    ⇥
                </span>

                <span>
                    ログアウト
                </span>

            </button>

        </form>

    </div>

</aside>

</html>
